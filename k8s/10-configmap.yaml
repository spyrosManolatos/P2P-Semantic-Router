# Runtime configuration as a ConfigMap, mounted OVER the image-baked
# config.prod.yaml. Editing this + `kubectl rollout restart` reconfigures the
# ring (e.g. replication_factor) with no image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dht-config
  namespace: dht
data:
  config.prod.yaml: |
    # P2P Semantic Router - Kubernetes deployment configuration
    network:
      default_host: "bootstrap-node"
      default_port: 5000
      timeout_sec: 3.0
      number_of_nodes: 5

    dht:
      hash_bits_m: 160
      replication_factor: 2
      stabilize_interval_sec: 1.0

    storage:
      centroids:
        synthetic_path: "data/models/synthetic_centroids.json"
        kaggle_dataset_path: "data/models/kaggle_centroids.json"
      data:
        synthetic_path: "data/raw/synthetic_data.json"
        kaggle:
          raw_path: "data/raw/udemy_courses.csv"
          normalized_path: "data/raw/normalized_kaggle_courses.json"
      num_courses: 500
