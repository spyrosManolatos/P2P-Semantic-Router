networks:
  ring_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  async-clustered-bootstrap:
    build:
      context: ../..
      dockerfile: containerized_environment/Dockerfile
    image: p2p-semantic-router:latest
    container_name: async-clustered-bootstrap
    command: ["--arch", "async_clustered", "--ip", "async-clustered-bootstrap", "--port", "5000"]
    networks:
      ring_net:
        ipv4_address: 172.30.0.10
    ports:
      - "8211:5000"
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src

  async-clustered-node-1:
    image: p2p-semantic-router:latest
    container_name: async-clustered-node-1
    command: ["--arch", "async_clustered", "--ip", "async-clustered-node-1", "--port", "5000", "--bootstrap", "async-clustered-bootstrap:5000"]
    depends_on:
      - async-clustered-bootstrap
    networks:
      ring_net:
        ipv4_address: 172.30.0.11
    ports:
      - "8212:5000"
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src

  async-clustered-node-2:
    image: p2p-semantic-router:latest
    container_name: async-clustered-node-2
    command: ["--arch", "async_clustered", "--ip", "async-clustered-node-2", "--port", "5000", "--bootstrap", "async-clustered-bootstrap:5000"]
    depends_on:
      - async-clustered-bootstrap
    networks:
      ring_net:
        ipv4_address: 172.30.0.12
    ports:
      - "8213:5000"
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src

  async-clustered-node-3:
    image: p2p-semantic-router:latest
    container_name: async-clustered-node-3
    command: ["--arch", "async_clustered", "--ip", "async-clustered-node-3", "--port", "5000", "--bootstrap", "async-clustered-bootstrap:5000"]
    depends_on:
      - async-clustered-bootstrap
    networks:
      ring_net:
        ipv4_address: 172.30.0.13
    ports:
      - "8214:5000"
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src

  async-clustered-node-4:
    image: p2p-semantic-router:latest
    container_name: async-clustered-node-4
    command: ["--arch", "async_clustered", "--ip", "async-clustered-node-4", "--port", "5000", "--bootstrap", "async-clustered-bootstrap:5000"]
    depends_on:
      - async-clustered-bootstrap
    networks:
      ring_net:
        ipv4_address: 172.30.0.14
    ports:
      - "8215:5000"
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src

  async-clustered-node-5:
    image: p2p-semantic-router:latest
    container_name: async-clustered-node-5
    command: ["--arch", "async_clustered", "--ip", "async-clustered-node-5", "--port", "5000"]
    networks:
      ring_net:
        ipv4_address: 172.30.0.15
    ports:
      - "8216:5000"
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src

  async-clustered-gateway:
    image: p2p-semantic-router:latest
    container_name: async-clustered-gateway
    entrypoint: ["uvicorn", "api.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      - TRANSPORT=json
      - DHT_NODES=async-clustered-bootstrap:5000,async-clustered-node-1:5000,async-clustered-node-2:5000,async-clustered-node-3:5000,async-clustered-node-4:5000
      - GATEWAY_TITLE=P2P Clustered DHT (async)
    depends_on:
      - async-clustered-bootstrap
      - async-clustered-node-1
      - async-clustered-node-2
      - async-clustered-node-3
      - async-clustered-node-4
    networks:
      ring_net:
        ipv4_address: 172.30.0.20
    ports:
      - "8081:8081"
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src

  async-clustered-runner:
    image: p2p-semantic-router:latest
    container_name: async-clustered-runner
    profiles:
      - runner
    depends_on:
      - async-clustered-bootstrap
      - async-clustered-node-1
      - async-clustered-node-2
      - async-clustered-node-3
      - async-clustered-node-4
      - async-clustered-node-5
    networks:
      - ring_net
    volumes:
      - ../../data:/app/data
      - ../../src:/app/src
    entrypoint: ["python", "-m", "src.benchmarks.containerized.evaluate", "--arch", "async_clustered", "--mode", "all", "--num_nodes", "5"]
