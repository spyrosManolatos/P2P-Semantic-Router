# LARGE-RING variant of config.vnodes.yaml (N >= 550). Identical except for the
# two maintenance parameters below.
#
# WHY: every vnode pings its successors each stabilize tick, and a peer that misses
# 3 CONSECUTIVE pings is deleted from the successor list. With timeout_sec=3.0 and
# stabilize_interval_sec=1.0 that evicts a HEALTHY node after ~3s of being busy.
# At N=550 the ring emits ~3850 maintenance RPC/s across 22 single-threaded asyncio
# loops (~175/s each), so pings routinely queue past 3s -- live nodes get cut out,
# the successor chain closes early, and the ring partitions into sub-cycles (a
# 71-of-550 loop was measured on 2026-08-23). N=275 sits at ~87 RPC/s per loop and
# never hits it.
#
# Neither parameter touches anything measured: they govern maintenance cadence and
# failure patience, and both settle before the first query is issued.
#
# Config for the VIRTUAL-NODE full-corpus scaling experiment (mode=hops).
# Identical to config.prod.yaml EXCEPT the kaggle centroids artifact points to
# the fine-grained k=4096 model trained on the full 98k corpus, so this ring
# runs at IVF granularity without touching the production K=80 artifact or any
# existing result. Selected via CONFIG_PATH in docker-compose.vnodes.yml.
#
# RF is still overridden AT RUNTIME by the benchmark
# (set_replication_factor(0)), as in the pilot.

network:
  default_host: "bootstrap-node"
  default_port: 5000
  timeout_sec: 4.0     # was 3.0. Only a small bump: stabilize_interval_sec below
                       # already cut maintenance traffic 5x, so queueing is far under
                       # 3s. A LARGE value (15.0 was tried) cripples recovery, because
                       # the empty-list rescue scan pings up to 160 fingers serially.
  number_of_nodes: 5

dht:
  hash_bits_m: 160
  replication_factor: 2
  # Successor-list length, decoupled from replication_factor. The disaster model
  # kills RF+1 = 3 ADJACENT nodes; a list of length RF=2 is therefore guaranteed to
  # empty, forcing the 160-finger rescue scan that stalled N=550 for 25+ minutes.
  # Chord sizes this as ~log2(N) (=~10 at N=550). Data replication is unchanged --
  # replicas still go to the first `replication_factor` successors.
  successor_list_size: 10
  stabilize_interval_sec: 5.0   # was 1.0 -- 5x less maintenance traffic (~35 RPC/s per loop)

storage:
  centroids:
    synthetic_path: "data/models/synthetic_centroids.json"
    kaggle_dataset_path: "data/models/kaggle_centroids_k5500.json"
  data:
    synthetic_path: "data/raw/synthetic_data.json"
    kaggle:
      raw_path: "data/raw/udemy_courses.csv"
      normalized_path: "data/raw/normalized_kaggle_courses.json"
  num_courses: 500
